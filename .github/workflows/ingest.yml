name: Ingestão

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job de ingestão a executar
        required: true
        type: choice
        options:
          - ping
          - knowledge_refresh
          - mpa_registry
          - markets_load
  # tides_yearly e mpa_closures NÃO estão aqui de propósito: os CSVs (marés e defesos) não vão ao
  # Git (ficam só na máquina de quem os gera), então esses jobs rodam localmente (ver README).
  # Agendamento: descomente cada linha quando o job correspondente estiver implementado.
  # schedule:
  #   - cron: "0 6 * * 1"   # exemplo: toda segunda-feira, 06:00 UTC

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Em Settings > Secrets and variables > Actions.
      DATABASE_URL: ${{ secrets.DATABASE_URL_ADMIN }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: ocean_conhecimento
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[ingest]"
      - name: Migrar o banco
        run: python -m ocean.storage.postgres.migrate
      - name: Executar o job
        run: python -m ocean.ingestion.run ${{ inputs.job }}
