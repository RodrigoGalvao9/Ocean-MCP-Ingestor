name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # segunda-feira, 09:00 UTC: pega CVEs novas sem precisar de commit
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependencies:
    name: Vulnerabilidades (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar (servidor + ingestão)
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[server,ingest]"
      - name: Auditar
        run: pip-audit --skip-editable

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # varre o histórico inteiro, não só o último commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
