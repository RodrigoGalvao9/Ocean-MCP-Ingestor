name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[server,ingest,dev]"
      - name: Lint
        run: ruff check .
      - name: Regras de importação (server x ingestion)
        run: lint-imports
      - name: Testes
        run: pytest -q
