[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocean-maritime"
version = "0.1.0"
description = "Servidor MCP somente leitura e ingestão de dados marítimos brasileiros (Ocean)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "tzdata>=2024.1",  # fusos horários no Windows e em imagens enxutas
]

[project.optional-dependencies]
# Imagem do servidor MCP (Render). Versões herdadas do ocean-rag-mcp, já testadas.
server = [
    "fastmcp==4.2.1",
    "fastmcp-slim==4.2.4",
    "fastembed==0.9.1",
    "qdrant-client==1.20.0",
]
# Ingestão (GitHub Actions).
ingest = [
    "fastembed==0.9.1",
    "qdrant-client==1.20.0",
    "pypdf>=4.0",
    "pymupdf>=1.24",  # leitura dos PDFs da DHN (AGPL-3.0; só na ingestão, fora da imagem do servidor)
    "beautifulsoup4>=4.12",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ocean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Regras de arquitetura (verificadas por `lint-imports`, também no CI).
[tool.importlinter]
root_package = "ocean"

[[tool.importlinter.contracts]]
name = "server nao importa ingestion"
type = "forbidden"
source_modules = ["ocean.server"]
forbidden_modules = ["ocean.ingestion"]

[[tool.importlinter.contracts]]
name = "ingestion nao importa server"
type = "forbidden"
source_modules = ["ocean.ingestion"]
forbidden_modules = ["ocean.server"]

[[tool.importlinter.contracts]]
name = "domain e independente"
type = "forbidden"
source_modules = ["ocean.domain"]
forbidden_modules = [
    "ocean.server",
    "ocean.ingestion",
    "ocean.retrieval",
    "ocean.storage",
]
